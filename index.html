<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ставки — RTS Logistic</title>
<style>
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --ink:#19232C; --ink2:#5C6872; --line:#D8DEE2; --sea:#1F4D6E; --seaInk:#FFFFFF;
  --best:#1B7A4A; --bestBg:#E6F4EC; --chip:#E9EDF0; --grp:#F3F5F4; --focus:#2B7BBF; --err:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A1F; --panel:#1C242B; --ink:#E6EBEE; --ink2:#9AA6B0; --line:#2E3A44; --sea:#2E6C95; --best:#5FC58E; --bestBg:#1C3A2B; --chip:#273039; --grp:#222B33; --focus:#6FB2E8; --err:#F2A097; }}
:root[data-theme="dark"]{ --bg:#141A1F; --panel:#1C242B; --ink:#E6EBEE; --ink2:#9AA6B0; --line:#2E3A44; --sea:#2E6C95; --best:#5FC58E; --bestBg:#1C3A2B; --chip:#273039; --grp:#222B33; --focus:#6FB2E8; --err:#F2A097; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%} *{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit} .hidden{display:none!important}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#gate h1{font-size:18px;margin:0;font-weight:600} #gate p{margin:0;color:var(--ink2);font-size:13px}
#gate label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
#gate label.chk{flex-direction:row;align-items:center;gap:6px}
#gate input[type=password]{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:100%}
#gate button{padding:9px 12px;border:0;border-radius:8px;background:var(--sea);color:var(--seaInk);font-weight:600;cursor:pointer}
#gate .err{color:var(--err);font-size:13px;min-height:1.2em;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sea);color:var(--seaInk);padding:12px 16px 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:17px;font-weight:600} .brand span{font-size:13px;opacity:.8}
nav{display:flex;gap:4px;margin-top:8px}
nav button{background:transparent;border:0;color:var(--seaInk);opacity:.7;padding:10px 12px;border-bottom:3px solid transparent;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:#fff}
main{padding:12px 16px 40px;max-width:1500px}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;margin-bottom:12px;align-items:flex-end}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.controls select,.controls input[type=number],.controls input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:130px}
.toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer} .toggle button[aria-pressed="true"]{background:var(--sea);color:var(--seaInk)}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;padding-bottom:8px}
.note{color:var(--ink2);font-size:13px;margin:0 0 10px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:600;font-size:12px;color:var(--ink2);background:var(--panel);position:sticky;top:0;z-index:2;text-align:center}
th.l{text-align:left} th.sub{top:28px;font-weight:500}
td.g{position:sticky;left:0;background:var(--grp);z-index:1;font-size:12px;color:var(--ink2);width:110px;min-width:110px}
td.g.first{font-weight:700;color:var(--ink);vertical-align:middle;text-align:center;font-size:13px;border-bottom:2px solid var(--sea)}
td.ln{position:sticky;left:110px;background:var(--panel);z-index:1;font-weight:600}
th.g{position:sticky;left:0;z-index:3;text-align:left;background:var(--grp)} th.ln{position:sticky;left:110px;z-index:3;text-align:left}
tr.sep td{border-top:2px solid var(--sea)}
td.c{text-align:right;cursor:pointer;min-width:56px} td.c:hover{background:var(--chip)}
td.c.best{color:var(--best);font-weight:700;background:var(--bestBg)} td.c.sup{font-size:12px;color:var(--ink2);text-align:left}
td.e{color:var(--line);text-align:center}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--best);vertical-align:-1px;margin-right:5px}
#sheet{position:fixed;inset:auto 0 0 0;max-height:80%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
#sheet h2{font-size:16px;margin:0 0 2px;padding-right:40px} #sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:10px}
#sheet .x{position:absolute;right:12px;top:10px;border:0;background:var(--chip);border-radius:50%;width:32px;height:32px;cursor:pointer}
.offer{border-top:1px solid var(--line);padding:10px 0} .offer:first-child{border-top:0}
.offer .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline} .offer .row b{font-size:16px;white-space:nowrap}
.offer .meta{font-size:13px;color:var(--ink2);margin-top:2px} .offer .n{font-size:13px;margin-top:4px;line-height:1.35}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--ink2);margin-left:6px;vertical-align:1px} .tag.ok{background:var(--bestBg);color:var(--best)}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:9}
.best2{display:grid;grid-template-columns:1fr;gap:14px} @media(min-width:760px){.best2{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px} .card h3{margin:0 0 6px;font-size:15px}
.rank{color:var(--ink2);font-size:12px;margin-right:6px} .empty{color:var(--ink2);padding:14px 0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

body.compact{font-size:13px}
body.compact th,body.compact td{padding:1px 6px;line-height:1.15}
body.compact th{font-size:11px} body.compact th.sub{top:19px}
body.compact td.ln{font-weight:600;font-size:12.5px} body.compact td.g.first{font-size:12px}
body.compact header{padding-top:6px} body.compact nav button{padding:6px 10px}
body.compact main{padding:8px 12px 20px} body.compact .controls{margin-bottom:6px;gap:6px 10px}
body.compact .controls select,body.compact .controls input[type=search]{padding:4px 8px} body.compact .toggle button{padding:4px 10px}
body.compact .note{margin:0 0 6px;font-size:12px} body.compact .legend{margin-top:5px}
</style>
</head>
<body class="compact">
<div id="gate">
  <form id="gf" autocomplete="off">
    <h1>Ставки Китай / Корея → ДВ</h1>
    <p>RTS Logistic · для сотрудников</p>
    <label>Пароль<input type="password" id="pw" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" id="rem"> запомнить на этом устройстве</label>
    <button type="submit">Открыть</button>
    <p class="err" id="gerr"></p>
  </form>
</div>
<div id="app" class="hidden">
<header>
  <div class="brand"><b>Ставки Китай / Корея → ДВ</b><span>обновлено <span id="upd"></span> · <span id="cnt"></span></span></div>
  <nav role="tablist">
    <button role="tab" data-tab="SOC" aria-selected="true">Фрахт SOC</button>
    <button role="tab" data-tab="COC" aria-selected="false">Фрахт COC</button>
    <button role="tab" data-tab="best" aria-selected="false">Лучшая ставка</button>
  </nav>
</header>
<main>
<section id="v-matrix">
  <div class="controls">
    <label id="lDrop" class="hidden">Сдача порожнего<select id="fDrop"></select></label>
    <label>Поставщик<select id="fSup"></select></label>
    <label>Линия<input id="fQ" type="search" placeholder="поиск"></label>
    <div class="toggle" id="mode"><button aria-pressed="true" data-m="rate">ставки</button><button aria-pressed="false" data-m="sup">поставщик</button></div>
    <label class="chk"><input type="checkbox" id="fAll" checked> все линии и порты макета</label>
    <label class="chk"><input type="checkbox" id="fBig"> крупнее</label>
  </div>
  <p class="note" id="mnote"></p>
  <div class="wrap"><table id="mx"></table></div>
  <div class="legend"><span><i></i>лучшая в порту (по 20')</span><span>USD за контейнер · 20' | 40'</span><span>нажмите ячейку — все предложения и условия</span></div>
</section>
<section id="v-best" class="hidden">
  <div class="controls">
    <label>Тип<select id="bKind"><option>SOC</option><option>COC</option></select></label>
    <label>Порт отправления<select id="bPol"></select></label>
    <label>Терминал ДВ<select id="bTerm"><option value="">любой</option><option>торговый</option><option>рыбный</option><option>врангель</option></select></label>
    <label id="lbDrop" class="hidden">Сдача порожнего<select id="bDrop"></select></label>
    <label>Наценка, USD<input id="bMk" type="number" value="0" min="0" step="10"></label>
  </div>
  <div class="best2">
    <div class="card"><h3>20'DC — самые дешёвые</h3><div id="b20"></div></div>
    <div class="card"><h3>40'HC — самые дешёвые</h3><div id="b40"></div></div>
  </div>
</section>
</main>
</div>
<div id="veil" class="hidden"></div>
<div id="sheet" class="hidden"><button class="x" id="sx" aria-label="Закрыть">✕</button><h2 id="sh"></h2><div class="sub" id="ss"></div><div id="sb"></div></div>
<script>

   2. Массив записей → JSON → шифрование: PBKDF2-SHA256 (ENC.it итераций, соль ENC.salt) даёт ключ AES-256-GCM (вектор ENC.iv);

const LS='rts.stavki.pw';
const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const te=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let ROWS=[];
async function tryOpen(pw,remember,silent){
  $('#gerr').textContent='';
  try{ ROWS=await unlock(pw); }
  catch(e){
    $('#gerr').textContent=e.message==='nocrypto'?'Браузер не может расшифровать данные — откройте страницу по https.':(silent?'Пароль изменился — введите новый.':'Неверный пароль.');
    return false;
  }
  try{ if(remember) localStorage.setItem(LS,pw); }catch(e){}
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden'); init(); return true;
}
$('#gf').onsubmit=e=>{ e.preventDefault(); tryOpen($('#pw').value,$('#rem').checked,false); };
(async()=>{
  let saved=null; try{ saved=localStorage.getItem(LS); }catch(e){}
  if(saved && !(await tryOpen(saved,false,true))){ try{ localStorage.removeItem(LS); }catch(e){} }
  if(!$('#gate').classList.contains('hidden')) $('#pw').focus();
})();

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const today=new Date(); today.setHours(0,0,0,0);
const dt=s=>{const m=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{4})/); return m?new Date(+m[3],+m[2]-1,+m[1]):null;};

function init(){
  const act=ROWS.filter(live);
  $('#upd').textContent=UPDATED; $('#cnt').textContent=act.length?`действующих ставок: ${act.length}`:'ставок пока нет';
  const sups=[...new Set(act.map(r=>r[F.sup]))].sort(); fill($('#fSup'),sups,['','все']);
  const drops=[...new Set(act.filter(r=>r[F.drop]).map(r=>r[F.drop]))].sort((a,b)=>a.localeCompare(b,'ru'));
  fill($('#fDrop'),drops,[NOFR,NOFR]); fill($('#bDrop'),drops,[NOFR,NOFR]);
  const pols=PORTS.filter(p=>act.some(r=>r[F.pol]===p)); fill($('#bPol'),pols);
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));render();});
  $('#mode').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;$('#mode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
  ['#fDrop','#fSup','#fQ','#fAll','#bKind','#bPol','#bTerm','#bDrop','#bMk'].forEach(s=>$(s).addEventListener('input',render));

function pool(kind,drop,sup){
  return ROWS.filter(r=>live(r) && r[F.kind]===kind && (sup?r[F.sup]===sup:true) &&
    (kind==='SOC' ? r[F.svc]==='Морской фрахт' : (drop===NOFR ? r[F.svc]==='Морской фрахт' : (r[F.svc]==='Фрахт со сдачей' && r[F.drop]===drop))));
}

  const kind=st.tab; $('#lDrop').classList.toggle('hidden',kind!=='COC');
  const drop=$('#fDrop').value||NOFR, sup=$('#fSup').value, q=$('#fQ').value.trim().toLowerCase(), all=$('#fAll').checked;
  const rows=pool(kind,drop,sup);
  let lay=[]; LAYOUT[kind].forEach(([g,lines])=>lines.forEach(l=>lay.push({g,l})));
  const gkey=g=>g.toLowerCase().replace(' сервис','');
  const cell=(g,l,p)=>rows.filter(r=>r[F.line]===l && r[F.pol]===p && String(r[F.term]||'').toLowerCase().includes(gkey(g)));
  if(q) lay=lay.filter(x=>x.l.toLowerCase().includes(q));
  const used=lay.filter(x=>PORTS.some(p=>cell(x.g,x.l,p).length));
  if(!all) lay=used;
  const ports=all?PORTS:PORTS.filter(p=>lay.some(x=>cell(x.g,x.l,p).length));
  const colBest={}; ports.forEach(p=>{let m=Infinity; lay.forEach(x=>cell(x.g,x.l,p).forEach(r=>{if(r[F.size]==='20DC'&&r[F.price]<m)m=r[F.price];})); colBest[p]=m;});
  let h='<thead><tr><th class="g" rowspan="2">Порт захода</th><th class="ln" rowspan="2">Линия</th>'+ports.map(p=>`<th colspan="2">${esc(p)}</th>`).join('')+'</tr><tr>'+ports.map(()=>`<th class="sub">20'</th><th class="sub">40'</th>`).join('')+'</tr></thead><tbody>';
  let prev=null;
  lay.forEach((x,i)=>{
    const first=x.g!==prev; const span=first?lay.filter(y=>y.g===x.g).length:0;
    h+=`<tr class="${first&&prev?'sep':''}">${first?`<td class="g first" rowspan="${span}">${esc(x.g)}</td>`:''}<td class="ln">${esc(x.l)}</td>`;
    ports.forEach(p=>{
      const rs=cell(x.g,x.l,p);
      if(!rs.length){h+='<td class="e">–</td><td class="e">–</td>';return;}
      const m20=rs.filter(r=>r[F.size]==='20DC').sort((a,b)=>a[F.price]-b[F.price])[0], m40=rs.filter(r=>r[F.size]==='40HC').sort((a,b)=>a[F.price]-b[F.price])[0];
      const isBest=m20&&m20[F.price]===colBest[p];
      if(st.mode==='rate') h+=`<td class="c ${isBest?'best':''}" data-i="${i}" data-p="${esc(p)}">${m20?fmt(m20[F.price]):'–'}</td><td class="c" data-i="${i}" data-p="${esc(p)}">${m40?fmt(m40[F.price]):'–'}</td>`;
      else h+=`<td class="c sup" data-i="${i}" data-p="${esc(p)}">${m20?esc(m20[F.sup]):'–'}</td><td class="c sup" data-i="${i}" data-p="${esc(p)}">${m40?esc(m40[F.sup]):'–'}</td>`;
    });
    h+='</tr>'; prev=x.g;
  });
  $('#mx').innerHTML=h+'</tbody>';
  $('#mnote').textContent=ROWS.filter(live).length
    ? `${kind}: ${rows.length} действующих ставок · ${used.length} строк с данными · ${kind==='COC'?(drop===NOFR?'только фрахт, сдача во Владивостоке':'all-in со сдачей порожнего: '+drop):'собственный контейнер'}`
    : 'База пока пуста — ставки появятся после первой загрузки.';
  $('#mx').querySelectorAll('td.c').forEach(td=>td.onclick=()=>{const x=lay[+td.dataset.i]; openSheet(x,td.dataset.p,cell(x.g,x.l,td.dataset.p));});
}
function offer(r,mk){ return `<div class="offer"><div class="row"><span>${esc(r[F.sup])} · ${esc(sizeLbl(r[F.size]))}<span class="tag ${r[F.conf]==='Подтверждена'?'ok':''}">${esc(r[F.conf])}</span></span><b>${fmt(r[F.price]+(mk||0))} ${esc(r[F.cur])}</b></div>
 <div class="meta">${r[F.drop]?'сдача: '+esc(r[F.drop])+' · ':''}${esc(r[F.frm])}–${esc(r[F.until])} · ${esc(r[F.term])} · ${esc(r[F.src])}</div>${r[F.comp]?`<div class="n">${esc(r[F.comp])}</div>`:''}${r[F.lim]?`<div class="n">${esc(r[F.lim])}</div>`:''}</div>`; }
function openSheet(x,p,rs){ $('#sh').textContent=`${x.l} — ${p} → ${x.g}`; $('#ss').textContent=rs[0]?rs[0][F.svc]+(rs[0][F.drop]?' · '+rs[0][F.drop]:''):'';
  $('#sb').innerHTML=[...rs].sort((a,b)=>String(a[F.size]).localeCompare(String(b[F.size]))||a[F.price]-b[F.price]).map(r=>offer(r)).join(''); $('#sheet').classList.remove('hidden'); $('#veil').classList.remove('hidden'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#veil').classList.add('hidden'); }
function renderBest(){
  const kind=$('#bKind').value; $('#lbDrop').classList.toggle('hidden',kind!=='COC');
  const mk=+$('#bMk').value||0, term=$('#bTerm').value, pol=$('#bPol').value;
  let rows=pool(kind,$('#bDrop').value||NOFR,'').filter(r=>r[F.pol]===pol && (!term||String(r[F.term]||'').toLowerCase().includes(term)));
  const list=(size)=>{const a=rows.filter(r=>r[F.size]===size).sort((x,y)=>x[F.price]-y[F.price]).slice(0,5);
    return a.length?a.map((r,i)=>`<div class="offer"><div class="row"><span><span class="rank">${i+1}</span>${esc(r[F.line])} · ${esc(r[F.sup])}<br><span class="meta">${esc(r[F.term])}${r[F.drop]?' · сдача '+esc(r[F.drop]):''}</span></span><b>${fmt(r[F.price]+mk)}${mk?` <span class="meta">(${fmt(r[F.price])})</span>`:''}</b></div><div class="meta">до ${esc(r[F.until])} · ${esc(r[F.comp])}</div></div>`).join(''):'<div class="empty">Нет действующих ставок.</div>';};
  $('#b20').innerHTML=list('20DC'); $('#b40').innerHTML=list('40HC');
}
</script>
</body>
</html>
